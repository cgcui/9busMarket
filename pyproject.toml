[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper9bus-gv-grpo"
version = "0.1.0"
description = "Standalone Paper9Bus Core-ESR and GV-GRPO training project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
